apiVersion: apps/v1
kind: Deployment
metadata:
  name: githook-shield-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: githook-shield
  template:
    metadata:
      labels:
        app: githook-shield
    spec:
      containers:
      - name: flask-app
        image: githook-shield-app:latest
        imagePullPolicy: Never  # Tells Minikube to use the local image you loaded
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: githook-shield-service
spec:
  type: NodePort
  selector:
    app: githook-shield
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30007