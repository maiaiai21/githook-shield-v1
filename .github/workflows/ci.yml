name: GitHook Shield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: pip install -r app/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile check
        run: python -m compileall -q app scanner

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # TruffleHog needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GitHook Shield scanner on all tracked files
        run: git ls-files -z | xargs -0 python3 scanner/secretscan.py

      - name: TruffleHog scan of repository history
        uses: trufflesecurity/trufflehog@main


  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Validate (no backend, no AWS credentials needed)
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  build-and-scan:
    name: Build image and scan for vulnerabilities
    needs: [test, secret-scan, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t githook-shield:${{ github.sha }} ./app

      - name: Trivy scan (fails on HIGH or CRITICAL fixable issues)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: githook-shield:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy JSON report for archiving
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: githook-shield:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Archive scan reports as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          path: trivy-report.json
          if-no-files-found: ignore

      - name: Upload scan report to S3
        if: always()
        env:
          REPORTS_BUCKET: ${{ secrets.REPORTS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -f trivy-report.json ]; then
            sh scripts/upload_report.sh trivy-report.json
          fi

  alert-on-failure:
    name: Send SNS alert when the pipeline fails
    needs: [test, secret-scan, terraform, build-and-scan]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish alert
        env:
          SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          sh scripts/publish_alert.sh \
            "GitHook Shield: pipeline failed" \
            "Commit ${{ github.sha }} on ${{ github.ref_name }} failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"