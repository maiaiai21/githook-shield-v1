server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /scan-log.json {
        alias /data/scan-log.json;
        add_header Cache-Control "no-store";
    }

    location = /evaluation/results.json {
        alias /data/results.json;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
